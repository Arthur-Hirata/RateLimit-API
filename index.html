<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acesse o painel da Rate Limit API.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <title>Rate Limit API</title>
</head>
<body>
    <main class="login-card" aria-label="Card de login">
        <h1>Entrar</h1>

        <form>
            <label for="email">E-mail</label>
            <input id="email" type="email" placeholder="seu@email.com" autocomplete="email">

            <label for="password">Senha</label>
            <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
            <button class="btn-eye"><i class="fas fa-eye"></i></button>
            <button type="button" class="entrar" onclick="login()">Entrar</button>
        </form>


        
    </main>
    <div class="container-second-route">
        <button onclick="secondRoute()" class="second-route">Second Route</button>
        <span class="spanContagem">Contagem</span>
        <p id="contagem">0</p>
    </div>
</body>
<script src="script.js"></script>
</html>
